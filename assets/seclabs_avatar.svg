<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d19" />
      <stop offset="50%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#08101e" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)" />

  <!-- Outer Cyber Border -->
  <rect x="32" y="32" width="960" height="960" rx="190" fill="none" stroke="#1e293b" stroke-width="4" />
  <rect x="48" y="48" width="928" height="928" rx="175" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" />

  <!-- Cyber Grid / Circuit Accents -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="3" fill="none">
    <path d="M120 280 H 260 L 320 220 H 420" />
    <path d="M904 280 H 764 L 704 220 H 604" />
    <path d="M120 744 H 260 L 320 804 H 420" />
    <path d="M904 744 H 764 L 704 804 H 604" />
    <circle cx="420" cy="220" r="8" fill="#38bdf8" fill-opacity="0.5" />
    <circle cx="604" cy="220" r="8" fill="#38bdf8" fill-opacity="0.5" />
    <circle cx="420" cy="804" r="8" fill="#4ade80" fill-opacity="0.5" />
    <circle cx="604" cy="804" r="8" fill="#4ade80" fill-opacity="0.5" />
  </g>

  <!-- Central Shield Polygon -->
  <polygon points="512,180 812,280 812,580 512,850 212,580 212,280" 
           fill="#0c192d" stroke="url(#cyanGlow)" stroke-width="12" filter="url(#glow)" />

  <!-- Inner Shield Accent -->
  <polygon points="512,220 772,310 772,560 512,790 252,560 252,310" 
           fill="none" stroke="#4ade80" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="16 8" />

  <!-- S / Mark -->
  <text x="420" y="580" font-family="'JetBrains Mono', Consolas, Arial, sans-serif" font-size="340" font-weight="900" fill="url(#cyanGlow)" text-anchor="middle">S</text>
  <text x="600" y="580" font-family="'JetBrains Mono', Consolas, Arial, sans-serif" font-size="340" font-weight="900" fill="url(#greenGlow)" text-anchor="middle">/</text>

  <!-- Subtitle -->
  <text x="512" y="720" font-family="'JetBrains Mono', Consolas, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="12" fill="#f8fafc" text-anchor="middle">SECLABS</text>
</svg>